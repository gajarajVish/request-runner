[project]
name = "request-runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "olefile>=0.47",
    "openai>=3.22.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 140
target-version = "py312"

[project.scripts]
rr = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
