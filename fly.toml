# fly launch --no-deploy --copy-config ; fly volumes create rr_data --size 1 ; fly secrets set ... ; fly deploy
app = "request-runner"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  DATA_DIR = "/data"
  EMAIL_PROVIDER = "postmark"
  LLM_PROVIDER = "anthropic"
  WORKSPACE_TIMEZONE = "America/New_York"

[mounts]
  source = "rr_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # the job worker sends reminders and escalations on a schedule, so keep one machine up
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
